name: 'insurance_platform'
version: '1.0.0'
config-version: 2

profile: 'insurance_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  insurance_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: marts
      actuarial:
        +materialized: table
        +schema: actuarial

vars:
  # Incurred development from the last observed age to ultimate. 1.0 assumes
  # incurred is fully developed by then (measured true value: 1.000, General
  # Liability 1.004). The paid tail is not a setting: fct_ata_factors derives
  # it per line as incurred / paid at the last age.
  incurred_tail_factor: 1.0
